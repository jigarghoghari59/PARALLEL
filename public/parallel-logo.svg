<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Left Outer Ring -->
  <circle cx="120" cy="120" r="80" stroke="#F2F3F0" stroke-width="22" stroke-opacity="0.95" filter="url(#subtle-glow)" />
  <!-- Right Outer Ring -->
  <circle cx="280" cy="120" r="80" stroke="#F2F3F0" stroke-width="22" stroke-opacity="0.95" filter="url(#subtle-glow)" />
  <!-- Left Inner Core Dot (Sage Green) -->
  <circle cx="120" cy="120" r="30" fill="#C8E9A9" />
  <!-- Right Inner Core Dot (Purple) -->
  <circle cx="280" cy="120" r="30" fill="#9678C9" />
</svg>